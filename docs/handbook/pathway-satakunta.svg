<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">Satakunta against Finland</title><desc id="d">Five-year bowel cancer survival in Satakunta and in Finland, 2019 to 2024.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">Satakunta: below Finland in every published year</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Five-year survival, bowel cancer, %. The gap was 4 to 9 points. No average: the yearly values share most of their patients.</text><line x1="70" y1="286.2" x2="770" y2="286.2" stroke="#e1e0d9"/><text x="62.0" y="290.2" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">56%</text><line x1="70" y1="238.7" x2="770" y2="238.7" stroke="#e1e0d9"/><text x="62.0" y="242.7" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">60%</text><line x1="70" y1="191.1" x2="770" y2="191.1" stroke="#e1e0d9"/><text x="62.0" y="195.1" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">64%</text><line x1="70" y1="143.6" x2="770" y2="143.6" stroke="#e1e0d9"/><text x="62.0" y="147.6" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">68%</text><line x1="70" y1="96.0" x2="770" y2="96.0" stroke="#e1e0d9"/><text x="62.0" y="100.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="end">72%</text><text x="70.0" y="330.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="middle">2019</text><text x="210.0" y="330.0" font-size="11.5" font-weight="400" fill="#898781" text-a