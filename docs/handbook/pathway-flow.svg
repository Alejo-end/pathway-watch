<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">How Pathway Watch makes a sentence</title><desc id="d">Open data goes into cached files, code computes facts, and a sentence is shown only if its numbers are in the facts it cites.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="439" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">Code computes every number. A sentence without a source is removed.</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The path of one number from the open source to the page.</text><rect x="24.0" y="76.0" width="250.0" height="304.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="38.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">OPEN SOURCES</text><rect x="38.0" y="108.0" width="222.0" height="77.7" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">THL Sotkanet</text><text x="50.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Survival, screening, doctor visits</text><text x="50.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">per county.</text><rect x="38.0" y="188.0" width="222.0" height="77.7" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="211.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Statistics Finland</text><text x="50.0" y="232.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Cancer deaths and population by</text><text x="50.0" y="249.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">age.</text><rect x="38.0" y="266.0" width="222.0" height="95.9" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="50.0" y="289.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">NORDCAN and Sweden&#x27;s</text><text x="50.0" y="308.1" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">RCC report</text><text x="50.0" y="328.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">National survival, and Sweden&#x27;s</text><text x="50.0" y="345.5" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">waiting times. Copied by hand.</text><rect x="300.0" y="76.0" width="380.0" height="304.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="314.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">PATHWAY WATCH (PLAIN CODE)</text><rect x="314.0" y="108.0" width="170.0" height="96.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="326.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Cached files</text><text x="326.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">data/raw/*.json, so the</text><text x="326.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">demo needs no network.</text><rect x="496.0" y="108.0" width="170.0" height="96.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="508.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Analysis</text><text x="508.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Gap to Finland, deaths</text><text x="508.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">against expected, the</text><text x="508.0" y="186.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">pathway rule.</text><rect x="314.0" y="240.0" width="170.0" height="104.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="326.0" y="263.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Facts</text><text x="326.0" y="284.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">One statement each, with</text><text x="326.0" y="301.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">the ID of its source.</text><rect x="496.0" y="240.0" width="170.0" height="104.0" rx="8" fill="#e6f0fc" stroke="#2a78d6" stroke-width="1"/><text x="508.0" y="263.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Sentence check</text><text x="508.0" y="284.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Keeps a sentence only if</text><text x="508.0" y="301.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">every number is in the</text><text x="508.0" y="318.6" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">facts it cites.</text><path d="M274.0 156.0L313.0 156.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M484.0 156.0L495.0 156.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M581.0 204.0L581.0 222.0L399.0 222.0L399.0 239.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M484.0 292.0L495.0 292.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="706.0" y="76.0" width="230.0" height="304.0" rx="12" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="720.0" y="98.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">THE PAGE</text><rect x="720.0" y="108.0" width="202.0" height="88.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="732.0" y="131.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Three sentences</text><text x="732.0" y="152.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">The gap, the question to</text><text x="732.0" y="169.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">investigate, the first action.</text><rect x="720.0" y="206.0" width="202.0" height="77.7" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="732.0" y="229.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Map, chart, action card</text><text x="732.0" y="250.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Each number links to its</text><text x="732.0" y="267.4" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">source.</text><rect x="720.0" y="290.0" width="202.0" height="78.0" rx="8" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/><text x="732.0" y="313.9" font-size="14" font-weight="650" fill="#0b0b0b" text-anchor="start">Data that is missing</text><text x="732.0" y="334.1" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">With the roadmap measure that</text><text x="732.0" y="351.3" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">would collect it.</text><path d="M666.0 292.0L688.0 292.0L688.0 152.0L719.0 152.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24.0" y="424.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">A fixed template writes the sentences. A language model can reword them, and the same check runs on its text. Source: backend/analyst.py.</text></svg>
