<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="t d"><title id="t">The care pathway and its data</title><desc id="d">The four steps of the cancer care pathway, and which of them has public data per county.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52514e"/></marker></defs><rect x="0.5" y="0.5" width="959" height="419" rx="12" fill="#fcfcfb" stroke="#e1e0d9"/><text x="24.0" y="34.0" font-size="17" font-weight="700" fill="#0b0b0b" text-anchor="start">The care pathway, and what public data exists for each county</text><text x="24.0" y="54.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Only the first step has a public number per county. That gap is the first finding of the app.</text><rect x="24.0" y="86.0" width="216.0" height="172.0" rx="8" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/><text x="38.0" y="108.0" font-size="10.5" font-weight="650" fill="#898781" text-anchor="start">STEP 1</text><text x="38.0" y="130.0" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Detection</text><rect x="38.0" y="142.0" width="118.0" height="28.0" rx="14" fill="#e7f6e7" stroke="#0ca30c" stroke-width="1.5"/><circle cx="53.0" cy="156.0" r="8.5" fill="#0ca30c"/><text x="53.0" y="160.3" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text><text x="68.0" y="160.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">data exists</text><text x="38.0" y="190.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Attendance in the public</text><text x="38.0" y="206.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">programme, per county and year.</text><text x="38.0" y="246.0" font-size="11" font-weight="500" fill="#898781" text-anchor="start">Sotkanet 6103, 3621, 3620</text><path d="M240.0 161.0L255.0 161.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="256.0" y="86.0" width="216.0" height="172.0" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 4"/><text x="270.0" y="108.0" font-size="10.5" font-weight="650" fill="#898781" text-anchor="start">STEP 2</text><text x="270.0" y="130.0" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Referral</text><rect x="270.0" y="142.0" width="118.0" height="28.0" rx="14" fill="#fff4d6" stroke="#fab219" stroke-width="1.5"/><circle cx="285.0" cy="156.0" r="8.5" fill="#fab219"/><text x="285.0" y="160.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">!</text><text x="300.0" y="160.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">no data</text><text x="270.0" y="190.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Nothing public per county.</text><text x="270.0" y="246.0" font-size="11" font-weight="500" fill="#898781" text-anchor="start">Roadmap measure 2.5.2</text><path d="M472.0 161.0L487.0 161.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="488.0" y="86.0" width="216.0" height="172.0" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 4"/><text x="502.0" y="108.0" font-size="10.5" font-weight="650" fill="#898781" text-anchor="start">STEP 3</text><text x="502.0" y="130.0" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Diagnosis</text><rect x="502.0" y="142.0" width="118.0" height="28.0" rx="14" fill="#fff4d6" stroke="#fab219" stroke-width="1.5"/><circle cx="517.0" cy="156.0" r="8.5" fill="#fab219"/><text x="517.0" y="160.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">!</text><text x="532.0" y="160.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">no data</text><text x="502.0" y="190.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Nothing public per county: no</text><text x="502.0" y="206.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">stage at diagnosis, and no wait</text><text x="502.0" y="223.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">for the tests.</text><text x="502.0" y="246.0" font-size="11" font-weight="500" fill="#898781" text-anchor="start">Roadmap measure 3.2.1</text><path d="M704.0 161.0L719.0 161.0" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="720.0" y="86.0" width="216.0" height="172.0" rx="8" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="5 4"/><text x="734.0" y="108.0" font-size="10.5" font-weight="650" fill="#898781" text-anchor="start">STEP 4</text><text x="734.0" y="130.0" font-size="15" font-weight="650" fill="#0b0b0b" text-anchor="start">Start of treatment</text><rect x="734.0" y="142.0" width="118.0" height="28.0" rx="14" fill="#fff4d6" stroke="#fab219" stroke-width="1.5"/><circle cx="749.0" cy="156.0" r="8.5" fill="#fab219"/><text x="749.0" y="160.3" font-size="12" font-weight="700" fill="#0b0b0b" text-anchor="middle">!</text><text x="764.0" y="160.5" font-size="13" font-weight="650" fill="#0b0b0b" text-anchor="start">no data</text><text x="734.0" y="190.0" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Nothing public per county.</text><text x="734.0" y="206.9" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Sweden reports it for all 21</text><text x="734.0" y="223.8" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">regions.</text><text x="734.0" y="246.0" font-size="11" font-weight="500" fill="#898781" text-anchor="start">Roadmap measures 3.1.2, 3.1.4</text><rect x="24.0" y="282.0" width="912.0" height="84.0" rx="10" fill="#f4f3ef" stroke="#e1e0d9" stroke-width="1"/><text x="38.0" y="304.0" font-size="11" font-weight="650" fill="#52514e" text-anchor="start">OUTCOMES, WHICH COME YEARS LATER</text><text x="38.0" y="326.0" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Five-year survival per county for bowel, breast and cervical cancer (Sotkanet). It describes care given up to ten years ago.</text><text x="38.0" y="348.0" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start">Cancer deaths per county, adjusted for age (Statistics Finland). For lung, pancreas and liver cancer this is the only county number.</text><text x="24.0" y="404.0" font-size="11.5" font-weight="400" fill="#898781" text-anchor="start">Breast and cervical cancer: low survival with low attendance raises a question about step 1. Bowel screening began in 2022, too late for this comparison.</text></svg>
